server {
    listen 80;
    server_name _;

    # Inclusion explicite des types MIME pour garantir que les fichiers .css et .js soient servis avec les bons headers
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimisation Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    # Racine des fichiers statiques compilés de React (SPA)
    root /usr/share/nginx/html;
    index index.html;

    # 1. Distribution directe des fichiers statiques Django (Admin, DRF, etc.)
    # CRITIQUE : Le modificateur '^~' empêche le bloc regex 'location ~* \.(css|js)$'
    # d'intercepter les requêtes /static/ et d'engendrer des erreurs 404 sur l'admin Django.
    location ^~ /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 2. Distribution directe des médias uploadés (images de projets)
    # Le modificateur '^~' priorise également ce chemin sur les règles regex
    location ^~ /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 3. Reverse Proxy vers l'interface d'administration Django
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Reverse Proxy vers l'API Django REST Framework
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 5. Mise en cache des assets statiques compilés de React (Vite)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 6. Routage SPA React : fallback vers index.html pour les routes clientes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
