services:
  # Base de données PostgreSQL optimisée pour un usage léger (< 256M)
  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Backend Django (Gunicorn + DRF)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-portfolio_db}
    volumes:
      # Volumes partagés en écriture pour les fichiers statiques collectés et les uploads
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M

  # Frontend React (SPA servie par Nginx + Distribution directe des statiques/médias)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Montage en lecture seule (:ro) des fichiers statiques Django et médias
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

# Volumes nommés persistants partagés
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
