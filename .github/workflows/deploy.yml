name: 🚀 Déploiement Continu (CD) - Production

# ------------------------------------------------------------------------------
# Déclencheurs du Workflow
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main       # Déclenchement sur chaque push sur main
  workflow_dispatch: # Déclenchement manuel via GitHub Actions UI

concurrency:
  group: production_environment
  cancel-in-progress: true

jobs:
  # ============================================================================
  # ÉTAPE 2 : Déploiement sur le Serveur VPS via SSH & Docker Compose
  # ============================================================================
  deploy:
    name: Déploiement VPS 
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Copy project files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.SERVER_PROJECT_PATH }}
          strip_components: 1
          rm: true

      - name: Execution de la mise à jour sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Connexion SSH établie sur le serveur distant."
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            
            echo "Récupération des dernières modifications Git..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "Vérification de la présence du fichier .env.docker..."
            if [ ! -f .env.docker ]; then
              echo "Le fichier .env.docker n'existe pas. Création automatique avec les variables GitHub..."
              cat << EOF > .env.docker
            # ==============================================================================
            # CONFIGURATION DOCKER & SERVICES (Production / Staging)
            # ==============================================================================

            # --- Sécurité & Mode Django ---
            DEBUG=${{ vars.DEBUG || 'False' }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DJANGO_SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS || 'localhost,127.0.0.1,169.58.171.214,portfolio-gnamien.faslab.online,test.ibson.online,backend,frontend' }}
            CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS || 'http://localhost http://127.0.0.1 http://169.58.171.214:81 https://portfolio-gnamien.faslab.online http://test.ibson.online' }}

            # --- Configuration CORS ---
            CORS_ALLOW_ALL_ORIGINS=${{ vars.CORS_ALLOW_ALL_ORIGINS || 'False' }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || 'http://localhost http://127.0.0.1 http://169.58.171.214:81 https://portfolio-gnamien.faslab.online http://test.ibson.online' }}

            CSRF_COOKIE_SECURE=${{ vars.CSRF_COOKIE_SECURE || 'False' }}
            SESSION_COOKIE_SECURE=${{ vars.SESSION_COOKIE_SECURE || 'False' }}

            # --- Base de Données PostgreSQL ---
            POSTGRES_DB=${{ vars.POSTGRES_DB || 'portfolio_db' }}
            POSTGRES_USER=${{ vars.POSTGRES_USER || 'postgres' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ vars.POSTGRES_PORT || '5432' }}
            DATABASE_URL=${{ vars.DATABASE_URL }}

            # --- Identifiants Superutilisateur ---
            DJANGO_SUPERUSER_USERNAME=${{ vars.DJANGO_SUPERUSER_USERNAME || 'admin' }}
            DJANGO_SUPERUSER_EMAIL=${{ vars.DJANGO_SUPERUSER_EMAIL || 'admin@example.com' }}
            DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}

            # --- Ports & Services Applications ---
            BACKEND_PORT=${{ vars.BACKEND_PORT || '8000' }}
            FRONTEND_PORT=${{ vars.FRONTEND_PORT || '81' }}
            EOF
              cp .env.docker .env
              echo "Fichiers .env.docker et .env générés avec succès depuis les variables GitHub !"
            else
              cp -n .env.docker .env || true
              echo "Le fichier .env.docker existe déjà. Conservation de vos secrets actuels."
            fi
            
            echo "Redémarrage des containers Docker Compose..."
            docker compose --env-file .env.docker down --remove-orphans
            docker compose --env-file .env.docker up -d --build
            echo "Attente de 10 secondes pour l'initialisation de PostgreSQL..."
            sleep 10
            echo "Exécution des migrations de base de données (Django)..."
            docker compose --env-file .env.docker exec -T backend python manage.py migrate --noinput
            
            echo "Nettoyage des images Docker inutilisées..."
            docker image prune -f
            
            echo "Déploiement terminé avec succès !"

  # ============================================================================
  # ÉTAPE 3 : Health Check (Vérification de Disponibilité)
  # ============================================================================
  health-check:
    name: Health Check (Statut Service)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test de l'application
        run: |
          echo "Attente de 15 secondes..."
          sleep 15
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.SSH_HOST }}:81/ || echo "000")
          echo "Code réponse HTTP: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo " Application en ligne !"
          else
            echo "Statut reçu: $STATUS_CODE"
          fi